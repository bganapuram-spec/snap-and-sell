<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap &amp; Sell Shop</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100dvh; }
  .topbar { background: var(--ink); color: #fff; text-align: center; font-size: 13px; font-weight: 600; padding: 9px 12px; letter-spacing: .02em; }
  .topbar b { color: var(--lime); font-weight: 700; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; max-width: 1280px; margin: 0 auto; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px 64px; }
  .hero { padding: 28px 0 30px; border-bottom: 1px solid var(--line); margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .hero h1 { font-size: clamp(48px, 8vw, 104px); }
  .hero p { color: var(--ink-2); font-size: 17px; margin: 12px 0 0; max-width: 520px; }
  .count { font-weight: 600; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 16px; }
  .tile { cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .tile .ph { aspect-ratio: 1; background: var(--surface); position: relative; overflow: hidden; }
  .tile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .tile:hover .ph img { transform: scale(1.04); }
  .tile .ph .flag { position: absolute; top: 12px; left: 12px; }
  .tile .body { padding: 12px 2px 0; }
  .tile .tag { color: var(--warn); font-weight: 600; font-size: 15px; }
  .tile .tag.sold { color: var(--muted); }
  .tile .t { font-weight: 600; font-size: 16px; line-height: 1.3; margin-top: 2px; }
  .tile .sub { color: var(--muted); font-size: 15px; }
  .tile .p { font-weight: 600; font-size: 16px; margin-top: 6px; }
  .tile.sold .ph { opacity: .55; }
  .section { margin-top: 56px; }
  .section h2 { font-size: 24px; margin-bottom: 18px; }
  .item { display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-items: start; }
  .item .photo { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); display: block; }
  .item h1 { font-size: clamp(36px, 4.4vw, 56px); }
  .item .cat { color: var(--muted); font-weight: 500; margin-top: 8px; }
  .item .price { font: 600 24px Inter, sans-serif; margin: 18px 0 6px; }
  .item .avail { font-weight: 600; color: var(--good); }
  .gallery { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .gallery img { width: 76px; height: 76px; object-fit: cover; cursor: pointer; background: var(--surface); opacity: .6; }
  .gallery img.on { opacity: 1; outline: 2px solid var(--ink); outline-offset: 2px; }
  .specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; margin: 22px 0; font-size: 15px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .specs dt { color: var(--muted); } .specs dd { margin: 0; font-weight: 600; }
  .cta { display: grid; gap: 10px; margin-top: 24px; }
  .cta .btn { width: 100%; padding: 20px; font-size: 16px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .hotline { margin-top: 10px; font-weight: 600; color: var(--warn); }
  .empty { text-align: center; padding: 80px 0; }
  .back { display: inline-block; margin: 0 0 18px; font-weight: 600; color: var(--muted); text-decoration: none; }
  @media (max-width: 820px) { .item { grid-template-columns: 1fr; gap: 24px; } header, .wrap { padding-left: 16px; padding-right: 16px; } .grid { grid-template-columns: 1fr 1fr; gap: 20px 10px; } }
</style>
</head>
<body>
<div class="topbar">One-of-a-kind vintage · <b>Make an offer on anything</b> · Pickup in store</div>
<header>
  <a href="/shop" id="home" class="brand" style="text-decoration:none;color:inherit"><span class="spark">S</span>SNAP &amp; SELL SHOP</a>
  <span class="live-dot">OPEN NOW</span>
</header>
<div class="wrap" id="app"></div>

<script src="/app.js"></script>
<script>
const parts = location.pathname.split('/').filter(Boolean)
const itemId = parts[1] === 'item' ? parts[2] : null
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : '')
// ?s=<shopId> is a guest shop's storefront; no parameter is the main shop.
const shopParam = new URLSearchParams(location.search).get('s')
const shopHome = (id) => (id ? `/shop?s=${encodeURIComponent(id)}` : '/shop')
$('home').href = shopHome(shopParam)

async function grid() {
  let r
  try { r = await api(shopParam ? `/api/shop?s=${encodeURIComponent(shopParam)}` : '/api/shop') } catch { return }
  const live = r.items.filter((i) => i.status === 'live')
  const sold = r.items.filter((i) => i.status === 'sold').slice(0, 6)
  const tile = (i) => el('a', { className: 'tile' + (i.status === 'sold' ? ' sold' : ''), href: `/shop/item/${i.id}` },
    el('div', { className: 'ph' },
      i.hasPhoto ? el('img', { src: `/api/items/${i.id}/photo`, alt: i.title, loading: 'lazy' }) : null,
      i.status === 'live' && i.interested ? el('span', { className: 'pill lime flag', textContent: `${i.interested} negotiating` }) : null),
    el('div', { className: 'body' },
      el('div', { className: 'tag' + (i.status === 'sold' ? ' sold' : ''), textContent: i.status === 'sold' ? 'Sold' : 'Open to offers' }),
      el('div', { className: 't', textContent: i.title }),
      el('div', { className: 'sub', textContent: [cap(i.facts?.condition) && cap(i.facts.condition) + ' condition', i.facts?.brand].filter(Boolean).join(' · ') || 'Vintage' }),
      el('div', { className: 'p', textContent: money(i.status === 'sold' ? i.soldPrice : i.listPrice) })))
  $('app').replaceChildren(
    el('div', { className: 'hero' },
      el('div', {}, el('h1', { textContent: 'Just dropped' }),
        el('p', { textContent: 'Every piece is one of a kind. See something you like? Make an offer. Our shop agent negotiates for real, the owner signs off on close calls.' })),
      el('div', { className: 'count', textContent: `${live.length} item${live.length === 1 ? '' : 's'} available` })),
    live.length ? el('div', { className: 'grid' }, ...live.map(tile)) : el('div', { className: 'card empty' }, el('h2', { textContent: 'New stock coming soon' }), el('p', { className: 'muted', textContent: 'Check back in a minute.' })),
    ...(sold.length ? [el('div', { className: 'section' }, el('h2', { textContent: 'Recently sold' }), el('div', { className: 'grid' }, ...sold.map(tile)))] : []))
}

let shown = 0
async function item() {
  let r
  try { r = await api(`/api/items/${itemId}`) } catch { $('app').replaceChildren(el('div', { className: 'card empty' }, el('h2', { textContent: 'That item isn’t here anymore' }), el('a', { href: shopHome(shopParam), textContent: '← Back to the shop' }))); return }
  const i = r.item, f = i.facts || {}
  $('home').href = shopHome(r.shopId)
  const live = i.status === 'live'
  const spec = [['Condition', cap(f.condition)], ['Brand', f.brand], ['Era', f.era], ['Material', f.material], ['Size', f.size], ['Color', cap(f.color)]].filter(([, v]) => v)
  $('app').replaceChildren(
    el('a', { href: shopHome(r.shopId), className: 'back', textContent: '← All items' }),
    el('div', { className: 'item' },
      el('div', {},
        i.hasPhoto ? el('img', { className: 'photo', id: 'mainPhoto', src: `/api/items/${i.id}/photo?i=${shown}`, alt: i.title }) : el('div', { className: 'photo' }),
        i.photoCount > 1 ? el('div', { className: 'gallery' }, ...Array.from({ length: i.photoCount }, (_, n) => el('img', {
          src: `/api/items/${i.id}/photo?i=${n}`, alt: `Photo ${n + 1}`, className: n === shown ? 'on' : '',
          onclick: () => { shown = n; $('mainPhoto').src = `/api/items/${i.id}/photo?i=${n}`; document.querySelectorAll('.gallery img').forEach((g, k) => g.classList.toggle('on', k === n)) } }))) : null),
      el('div', {},
        el('h1', { textContent: i.title }),
        el('div', { className: 'cat', textContent: [cap(f.condition) && cap(f.condition) + ' condition', f.brand, f.era].filter(Boolean).join(' · ') || 'Vintage' }),
        el('div', { className: 'price', textContent: money(i.status === 'sold' ? i.soldPrice : i.listPrice) }),
        i.status === 'sold' ? el('span', { className: 'pill good', textContent: 'Sold' }) : el('div', { className: 'avail', textContent: 'Available · open to offers' }),
        r.stats.buyers && live ? el('div', { className: 'hotline', textContent: `${r.stats.buyers} ${r.stats.buyers === 1 ? 'person is' : 'people are'} negotiating on this right now` }) : null,
        el('p', { style: 'font-size:16px;line-height:1.6;margin-top:22px', textContent: i.description }),
        spec.length ? el('dl', { className: 'specs' }, ...spec.flatMap(([k, v]) => [el('dt', { textContent: k }), el('dd', { textContent: v })])) : null,
        (f.highlights?.length || f.flaws?.length) ? el('div', { className: 'facts' },
          ...(f.highlights || []).map((t) => el('span', { className: 'pill', textContent: '✓ ' + t })),
          ...(f.flaws || []).map((t) => el('span', { className: 'pill flaw', textContent: '' + t }))) : null,
        live ? el('div', { className: 'cta' },
          el('a', { className: 'btn', href: `/buy/${i.id}?intent=offer`, textContent: 'Make an offer' }),
          el('a', { className: 'btn btn-ghost', href: `/buy/${i.id}?intent=ask`, textContent: 'Ask about it' })) : null,
        f.merchantNotes ? el('p', { style: 'margin-top:20px', textContent: `From the shop: ${f.merchantNotes}` }) : null,
        el('p', { className: 'note', textContent: 'Pickup in store. You’re chatting with the shop’s AI sales agent; the owner approves close calls.' }))))
}

if (itemId) { item(); setInterval(item, 5000) } else { grid(); setInterval(grid, 4000) }
</script>
</body>
</html>
